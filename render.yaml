services:
  - type: web
    name: nexucon-backend
    env: docker
    region: frankfurt
    plan: free
    dockerCommand: "./entrypoint.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexucon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexucon-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: nexucon-redis
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DEBUG
        value: "False"



  - type: redis
    name: nexucon-redis
    region: frankfurt
    plan: free
    ipAllowList: []

databases:
  - name: nexucon-db
    databaseName: nexucon
    user: nexucon
    region: frankfurt
    plan: free
    # Render's PostgreSQL supports PostGIS natively via 'CREATE EXTENSION postgis;'
